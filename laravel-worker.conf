; ============================================
; Laravel Queue Workers - Job2You
; ============================================
; Copier vers : /etc/supervisor/conf.d/laravel-worker.conf
; Puis : sudo supervisorctl reread && sudo supervisorctl update
; ============================================

[program:laravel-queue-default]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/job2you/artisan queue:work database --queue=default --sleep=3 --tries=3 --max-time=3600 --memory=256
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/job2you/storage/logs/worker-default.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=APP_ENV="production",APP_DEBUG="false"

